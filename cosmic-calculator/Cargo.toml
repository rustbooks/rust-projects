[package]
name = "cosmic-calculator"
version = "0.1.0"
edition = "2024"
authors = ["Anirudha Anil Gaikwad"]
description = "A full-featured calculator for the COSMIC desktop environment"

[[bin]]
name = "cosmic-calculator"
path = "src/main.rs"

[dependencies]
libcosmic = { git = "https://github.com/pop-os/libcosmic.git", features = ["tokio", "winit", "wayland", "desktop"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
once_cell = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
