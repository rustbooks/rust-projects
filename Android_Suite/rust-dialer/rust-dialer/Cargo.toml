[package]
name        = "rust-dialer"
version     = "1.0.0"
edition     = "2021"
authors     = ["RustDialer Contributors"]
description = "Cross-platform Material You Dialer — Rust + Slint"
license     = "MIT"
rust-version = "1.75"

# ── Release profile: optimized for minimal binary size ───────────────────────
[profile.release]
opt-level       = "z"     # size-first (vs "3" = speed-first)
lto             = true    # cross-crate dead-code removal
codegen-units   = 1       # best LTO; slower compile, smaller output
strip           = true    # remove debug symbols
panic           = "abort" # no unwinder code (~200 KB saving)
overflow-checks = false

[profile.dev]
opt-level = 1             # faster incremental dev builds

# ── Library (Android cdylib + test rlib) ─────────────────────────────────────
[lib]
name       = "rust_dialer"
crate-type = ["cdylib", "rlib"]

# ── Desktop binary ────────────────────────────────────────────────────────────
[[bin]]
name = "rust-dialer"
path = "src/main.rs"

# ── Runtime dependencies ──────────────────────────────────────────────────────
[dependencies]
# Slint UI framework with Material You style
slint       = { version = "1.9", features = ["compat-1-2"] }

# Serialization
serde       = { version = "1", features = ["derive"] }
serde_json  = "1"

# AES-256-GCM encryption for contacts at rest
aes-gcm     = { version = "0.10", features = ["std"] }
rand        = "0.8"

# Stable UUIDs for contact IDs
uuid        = { version = "1", features = ["v4", "serde"] }

# Timestamps
chrono      = { version = "0.4", features = ["serde"] }

# Logging (zero-cost in release with log crate)
log         = "0.4"
env_logger  = { version = "0.11", optional = true }

# Platform data directories (AppData / ~/.local/share / etc.)
dirs        = "5"

# ── Build dependencies ────────────────────────────────────────────────────────
[build-dependencies]
slint-build = "1.9"

# ── Dev/test dependencies ─────────────────────────────────────────────────────
[dev-dependencies]
tempfile = "3"

# ── Features ─────────────────────────────────────────────────────────────────
[features]
default = ["logging"]
logging = ["env_logger"]
android = []
