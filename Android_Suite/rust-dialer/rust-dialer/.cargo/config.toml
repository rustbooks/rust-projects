# .cargo/config.toml
# ─────────────────────────────────────────────────────────────────────────────
# Cargo build configuration for cross-platform targets.
#
# Usage:
#   Desktop   : cargo build --release
#   Android 64: cargo build --release --target aarch64-linux-android
#   Android 32: cargo build --release --target armv7-linux-androideabi
#   Windows   : cargo build --release --target x86_64-pc-windows-msvc
# ─────────────────────────────────────────────────────────────────────────────

# ── Android AArch64 (arm64-v8a) ─────────────────────────────────────────────
[target.aarch64-linux-android]
linker = "aarch64-linux-android34-clang"
ar     = "llvm-ar"

# ── Android ARMv7 (armeabi-v7a) ──────────────────────────────────────────────
[target.armv7-linux-androideabi]
linker = "armv7a-linux-androideabi34-clang"
ar     = "llvm-ar"

# ── Android x86_64 (emulator) ────────────────────────────────────────────────
[target.x86_64-linux-android]
linker = "x86_64-linux-android34-clang"
ar     = "llvm-ar"

# ── Linux (native) ───────────────────────────────────────────────────────────
[target.x86_64-unknown-linux-gnu]
rustflags = ["-C", "link-arg=-Wl,--as-needed"]

# ── Windows MSVC ─────────────────────────────────────────────────────────────
[target.x86_64-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static"]

# ── Build flags for all targets ───────────────────────────────────────────────
[build]
# Parallel codegen jobs — set to number of CPU cores for fastest release builds
jobs = 4

[env]
# Tell slint-build which style to compile
SLINT_STYLE = "material"
