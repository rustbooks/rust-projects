# .github/workflows/ci.yml
# Continuous Integration: build, test, clippy, audit on every push/PR.

name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # ── Test (Linux) ─────────────────────────────────────────────────────────────
  test:
    name: Test Suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Install Linux dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libxkbcommon-dev libwayland-dev libgl1-mesa-dev \
            libxrandr-dev libxi-dev libx11-dev pkg-config

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Check formatting
        run: cargo fmt --check

      - name: Clippy (zero warnings)
        run: cargo clippy --all-targets -- -D warnings

      - name: Run tests
        run: cargo test --all

      - name: Security audit
        run: |
          cargo install cargo-audit --quiet
          cargo audit

  # ── Build Release (Linux) ────────────────────────────────────────────────────
  build-linux:
    name: Build Linux Release
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux dependencies
        run: sudo apt-get install -y libxkbcommon-dev libwayland-dev libgl1-mesa-dev pkg-config
      - name: Build release
        run: cargo build --release
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: contacts-app-linux
          path: target/release/contacts-app

  # ── Build Release (Windows) ──────────────────────────────────────────────────
  build-windows:
    name: Build Windows Release
    runs-on: windows-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build release
        run: cargo build --release
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: contacts-app-windows
          path: target/release/contacts-app.exe

  # ── Build Release (macOS) ────────────────────────────────────────────────────
  build-macos:
    name: Build macOS Release
    runs-on: macos-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build release
        run: cargo build --release
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: contacts-app-macos
          path: target/release/contacts-app
