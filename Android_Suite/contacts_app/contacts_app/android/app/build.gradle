// android/app/build.gradle
// Android Gradle build file for the Contacts App.
// The Rust .so files are pre-built by cargo-ndk and placed in jniLibs.

plugins {
    id 'com.android.application'
}

android {
    namespace 'com.contacts.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.contacts.app"
        minSdk 26                  // Android 8.0 — covers 95%+ of active devices
        targetSdk 34               // Android 14
        versionCode 1
        versionName "1.0.0"

        // ABI filters — build only what we need
        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a', 'x86_64'
        }
    }

    buildTypes {
        debug {
            debuggable true
            jniDebuggable true
        }
        release {
            minifyEnabled false     // Rust binary is already stripped
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt')
            // Signing config: set up your keystore here for release builds
            // signingConfig signingConfigs.release
        }
    }

    // Slint uses NativeActivity — disable Java bytecode shrinking for JNI compat
    packagingOptions {
        jniLibs {
            useLegacyPackaging = true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // No Java dependencies needed — all logic is in Rust
    // Add only Android support libs if needed for file picker, etc.
}
