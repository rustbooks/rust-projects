[package]
name = "android-calculator"
version = "1.0.0"
edition = "2021"
authors = ["Anirudha Gaikwad"]
description = "Production-grade Material You Calculator for Android/Desktop"
license = "MIT"
rust-version = "1.75"

[[bin]]
name = "android-calculator"
path = "src/main.rs"

[dependencies]
slint = { version = "1.16.1", features = ["backend-winit", "renderer-femtovg"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
dirs = "5.0"
log = "0.4"
env_logger = "0.11"
thiserror = "1.0"
anyhow = "1.0"

[build-dependencies]
slint-build = "1.16.1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[profile.dev]
opt-level = 0
debug = true
