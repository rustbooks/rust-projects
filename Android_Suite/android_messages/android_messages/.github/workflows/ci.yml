# .github/workflows/ci.yml
# CI pipeline: build + test on Linux, Windows, macOS.

name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

env:
  CARGO_TERM_COLOR: always
  RUST_LOG: info

jobs:
  # ── Test on all desktop platforms ─────────────────────────────────────────
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest, macos-latest ]

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      # Linux: install system UI dependencies for Slint
      - name: Install Linux deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            libxkbcommon-dev libfontconfig1-dev \
            libwayland-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            pkg-config libssl-dev

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy (deny warnings)
        run: cargo clippy --all-targets -- -D warnings

      - name: Build (debug)
        run: cargo build --all-targets

      - name: Run tests
        run: cargo test --all

      - name: Security audit
        run: |
          cargo install cargo-audit --quiet
          cargo audit

  # ── Release build size check ───────────────────────────────────────────────
  size-check:
    name: Release size (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ ubuntu-latest ]

    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      - name: Install Linux deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            libxkbcommon-dev libfontconfig1-dev \
            libwayland-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            pkg-config

      - name: Build release
        run: cargo build --release

      - name: Check binary size
        run: |
          SIZE=$(stat -c%s target/release/android-messages)
          echo "Binary size: $((SIZE / 1024 / 1024)) MB ($SIZE bytes)"
          # Fail if > 20 MB (our target is < 15 MB)
          if [ $SIZE -gt 20971520 ]; then
            echo "ERROR: Binary exceeds 20 MB size limit!"
            exit 1
          fi
